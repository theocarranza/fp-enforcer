[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fp-enforcer"
version = "0.3.1"
description = "Functional programming rule enforcement for AI coding harnesses: validation hooks, curated pattern packs, and agent skills for Cursor, Claude, Codex, and Antigravity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "monolith" }]
keywords = ["functional-programming", "linting", "ai-agents", "cursor", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
fp-enforcer = "fp_enforcer.__main__:main"

[project.urls]
Repository = "https://github.com/theocarranza/fp-enforcer"
Changelog = "https://github.com/theocarranza/fp-enforcer/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["fp_enforcer*"]
namespaces = false

[tool.setuptools.package-data]
fp_enforcer = ["rules/**/*", "skills/**/*"]
